# consensuscnv config -- the fields `consensuscnv call` needs.
# Every option, with its default, and the `benchmark` settings: config.full.yaml.

# Caller output, one block per call set: tool label -> per-sample path pattern.
# {id} is the sample id; glob patterns work.
experimental:
  "My Samples":
    cnvpytor: "/path/to/cnvpytor/{id}.calls.vcf"
    delly: "/path/to/delly/{id}.bcf"
    gatk: "/path/to/gatk/{id}/*_segments_{id}.vcf.gz"

# Where parsed BEDs and consensus output are written.
output_dir: "/path/to/output"

# Chromosome lengths, name<TAB>length. A chromosome commented out is excluded.
genome_file: "genome_autosome_hg38.txt"

# BED of regions a call may not lie in [optional]. hg38 centromeres and gaps.
excluded_regions_file: "excluded_regions_hg38.bed"

consensus:
  # Reciprocal overlap for two calls to be the same event. A list runs each value.
  reciprocal_overlap: [0.5]
  # Drop consensus calls shorter than this, in base pairs.
  min_size: 1000
