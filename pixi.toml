[workspace]
authors = ["Lionel Sequeira <lionelsequeira@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "blendedCNV_pipeline"
platforms = ["linux-64"]
version = "0.2.0"

[tasks]
clean = "rm -rf build dist src/consensuscnv.egg-info"
build = { cmd = "python -m build", depends-on = ["clean"] }

# Kept in sync with pyproject.toml
[dependencies]
python = ">=3.14.6,<3.15"

# Runtime. Mirrors pyproject [project.dependencies].
cyvcf2 = ">=0.34.0,<0.35"
numpy = ">=2.5.1,<3"
pandas = ">=3.0.5,<4"
pyyaml = ">=6.0.3,<7"
requests = ">=2.34.2,<3"
scipy = ">=1.18.0,<2"

# Figures for manuscript/scripts only.
matplotlib = ">=3.11.1,<4"

# Development. Mirrors pyproject [dependency-groups] dev.
# conda-forge calls the PyPI `build` frontend `python-build`.
python-build = ">=1.3.0,<2"
pytest = ">=9.1.1,<10"
ruff = ">=0.16.1,<0.17"

# pixi's own tooling.
pip = ">=26.2,<27"
uv = ">=0.12.1,<0.13"

[pypi-dependencies]
consensuscnv = { path = ".", editable = true }
liftover = ">=1.4.1, <2"
