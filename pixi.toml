[workspace]
authors = ["Lionel Sequeira <lionelsequeira@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "blendedCNV_pipeline"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.14.6,<3.15"
marimo = ">=0.23.13,<0.24"
matplotlib = ">=3.11.0,<4"
matplotlib-venn = ">=1.1.2,<2"
numpy = ">=2.5.1,<3"
pandas = ">=3.0.3,<4"
pyyaml = ">=6.0.3,<7"
requests = ">=2.34.2,<3"
scipy = ">=1.18.0,<2"
seaborn = ">=0.13.2,<0.14"
networkx = ">=3.6.1,<4"
ruff = ">=0.15.20,<0.16"
vegafusion = ">=2.0.3,<3"
vl-convert-python = ">=2.0.0rc1,<3"
python-lsp-server = ">=1.14.0,<2"
websockets = ">=16.0,<17"
python-lsp-ruff = ">=2.3.1,<3"
uv = ">=0.11.28,<0.12"

[pypi-dependencies]
consensuscnv = { path = ".", editable = true }
