[workspace]
authors = ["Lionel Sequeira <lionelsequeira@gmail.com>"]
channels = ["conda-forge", "bioconda"]
name = "blendedCNV_pipeline"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.14.6,<3.15"
marimo = ">=0.23.16,<0.24"
matplotlib = ">=3.11.1,<4"
