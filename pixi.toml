pyyaml = ">=6.0.3,<7"
requests = ">=2.34.2,<3"
scipy = ">=1.18.0,<2"
seaborn = ">=0.13.2,<0.14"
networkx = ">=3.6.1,<4"
vegafusion = ">=2.0.3,<3"
vl-convert-python = ">=2.0.0rc1,<3"
python-lsp-server = ">=1.15.0,<2"
websockets = ">=17.0.1,<18"
python-lsp-ruff = ">=2.3.1,<3"
uv = ">=0.12.1,<0.13"
line_profiler = ">=5.0.2,<6"
plotly = ">=6.9.0,<7"
