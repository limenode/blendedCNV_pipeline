name: Publish to PyPI

# Build once, verify that single artifact across the whole supported Python
# range, then publish it: TestPyPI on a manual run (a dry run you can repeat),
# PyPI when a GitHub Release is published. Authentication is PyPI Trusted
# Publishing (OIDC) -- no API tokens and no stored secrets.
#
# The supported range is 3.12 to 3.14: `requires-python` in pyproject.toml,
# which is set by numpy >= 2.5 and scipy >= 1.18. Keep the matrix below, the
# classifiers, and that field in step.
on:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege by default; the two publish jobs opt into id-token below.
permissions:
  contents: read

# Never let two publish runs race for the same version.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build backend
        run: python -m pip install --upgrade build
      - name: Build sdist and wheel
        # A fresh checkout has no build/ directory, so this is the same build
        # `pixi run build` does after its clean step.
        run: python -m build
      - name: Check metadata renders on PyPI
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        # A release tagged v0.3.0 must carry consensuscnv-0.3.0; publishing a
        # mismatched pair is the mistake this job exists to catch.
        run: |
          WHEEL=$(ls dist/*.whl)
          VERSION=$(basename "${WHEEL}" | cut -d- -f2)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "${VERSION}" != "${TAG}" ]; then
            echo "::error::release tag ${GITHUB_REF_NAME} does not match package version ${VERSION}"
            exit 1
          fi
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  verify:
    name: Verify wheel on Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      # The checkout is for tests/ only. The package is installed from the
      # wheel, and src/ is not on sys.path, so the tests exercise the artifact.
      - uses: actions/checkout@v7
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the built wheel
        run: |
          WHEEL=$(ls dist/*.whl)
          python -m pip install "${WHEEL}" pytest
      - name: Smoke-test the entry points
        run: |
          consensuscnv --version
          consensuscnv --help > /dev/null
          python -m consensuscnv --help > /dev/null
          consensuscnv init "${RUNNER_TEMP}/init" > /dev/null   # the templates ship in the wheel
          python -c "from consensuscnv.callsets import collect_callsets, merge_components"
          python -c "from consensuscnv.classification import IntervalSet, build_candidates, classify"
      - name: Run the test suite against the installed wheel
        run: python -m pytest

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, verify]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/consensuscnv
    permissions:
      id-token: write          # required for OIDC trusted publishing
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: [build, verify]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/consensuscnv
    permissions:
      id-token: write          # required for OIDC trusted publishing
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
