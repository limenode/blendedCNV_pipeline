# Analysis Plots Configuration
# Defines groupings and visualizations for the analysis pipeline.
# Reference this file from config.yaml via:
#   analysis_plots_config: "/path/to/analysis_plots.yaml"
#
# Input set keys used here are derived automatically from your config.yaml `input` section.
# The pattern is: <input_key_spaces_replaced_with_underscores>_<caller_or_consensus>
# e.g. "6x Coverage" + "cnvpytor" -> "6x_Coverage_cnvpytor"
#      "6x Coverage" + "consensus_2of3_intersections" -> "6x_Coverage_consensus_2of3_intersections"
# Control set keys are the input key with spaces replaced by underscores (e.g. "SNP Array" -> "SNP_Array").

# Samples to include in log analysis
samples_of_interest:
  - HG01890
  - NA19347
  - HG00513
  - HG01596
  - NA19238
  - NA19331
  - HG00096
  - HG00171
  - NA18989
  - HG00268
  - NA20847
  - HG00731
  - NA19129

# Venn diagram specifications (recall-based)
# output_filename: placed under <output_dir>/figures/venn_diagrams/
venn_diagrams:
  6x_intersections:
    sets:
      - 6x_Coverage_consensus_2of3_intersections
      - 30x_Coverage_consensus_2of3_intersections
      - SNP_Array
    title: "Venn Diagram of Intersections with 6x Coverage"
    output_filename: "venn_diagram_6x_intersections.png"

  4x_intersections:
    sets:
      - 4x_Coverage_consensus_2of3_intersections
      - 30x_Coverage_consensus_2of3_intersections
      - SNP_Array
    title: "Venn Diagram of Intersections with 4x Coverage"
    output_filename: "venn_diagram_4x_intersections.png"

  2x_intersections:
    sets:
      - 2x_Coverage_consensus_2of3_intersections
      - 30x_Coverage_consensus_2of3_intersections
      - SNP_Array
    title: "Venn Diagram of Intersections with 2x Coverage"
    output_filename: "venn_diagram_2x_intersections.png"

  6x_unions:
    sets:
      - 6x_Coverage_consensus_2of3_unions
      - 30x_Coverage_consensus_2of3_unions
      - SNP_Array
    title: "Venn Diagram of Unions with 6x Coverage"
    output_filename: "venn_diagram_6x_unions.png"

  4x_unions:
    sets:
      - 4x_Coverage_consensus_2of3_unions
      - 30x_Coverage_consensus_2of3_unions
      - SNP_Array
    title: "Venn Diagram of Unions with 4x Coverage"
    output_filename: "venn_diagram_4x_unions.png"

  2x_unions:
    sets:
      - 2x_Coverage_consensus_2of3_unions
      - 30x_Coverage_consensus_2of3_unions
      - SNP_Array
    title: "Venn Diagram of Unions with 2x Coverage"
    output_filename: "venn_diagram_2x_unions.png"

# Count Venn diagram input set keys (one diagram generated per entry)
# Must match keys in the config.yaml `input` section exactly (spaces preserved).
# output_filename is auto-derived as: count_venn_diagram_<key_with_underscores>.png
count_venn_diagrams:
  - "30x Coverage"
  - "6x Coverage"
  - "4x Coverage"
  - "2x Coverage"

